[package]
name = "constant-mandate"
version = "0.1.0"
edition = "2021"
publish = false
description = "ConstantUnits bill mandates on Soroban: a capped, revocable allowance per bill."
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
