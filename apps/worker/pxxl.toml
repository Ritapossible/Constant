# Pxxl: the worker as its own Web Service, no public domain needed (D-078). It answers GET /health on $PORT so Pxxl can
# check it; healthy only while its order loop keeps running. Pxxl reads this file when the base directory is
# apps/worker. Guide: docs/PXXL.md
version = 1

[build]
language = "javascript"
packageManager = "pnpm"
nodeVersion = "22"
port = 8081
installCommand = "cd ../.. && corepack enable && pnpm install --frozen-lockfile"
buildCommand = "cd ../.. && pnpm --filter './packages/*' --filter @constant/worker run build"
startCommand = "node dist/main.js"
